[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glm2api"
version = "0.1.0"
description = "A lightweight proxy that translates the Zhipu Qingyan (ChatGLM) web API into an OpenAI Chat Completions compatible API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
glm2api = "glm2api.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
