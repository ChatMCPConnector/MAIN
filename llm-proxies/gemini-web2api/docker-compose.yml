services:
  gemini-web2api:
    # Pulls the prebuilt image by default — no source needed, downloading just this file is enough to run.
    # To build from source (changed code, or you want to audit it yourself), uncomment the two build lines below.
    image: ghcr.io/zexadev/gemini-web2api-go:latest
    # build:
    #   context: .
    container_name: gemini-web2api
    restart: unless-stopped

    # ── Only things that require a process restart go here ────────────────
    # Tuning parameters (rate limits, retries, timeouts, default model, TLS
    # fingerprint, bl version, fallback switches, logging, retention) are
    # managed in the admin panel under Settings → Runtime config; saving
    # applies immediately. Credentials (API key, Google cookie) are also
    # managed in the panel and stored in the database. The API_KEY env var
    # and cookie mount below are **optional lock-in switches** for
    # deployments that must not change at runtime; when unset, the panel
    # is authoritative.

    ports:
      - "127.0.0.1:8083:8083"
    # To expose to other containers on the same docker network (no public
    # internet), use:
    # expose:
    #   - "8083"
    # and have the other containers join the default network below or a
    # custom network.

    volumes:
      # Use a named volume instead of ./data:/data — the image runs as
      # nonroot (uid 65532), and a bind mount overwrites /data's ownership
      # with the host directory's. If the directory doesn't exist on the
      # host, Docker creates it owned by root, the container can't write,
      # and you get `unable to open database file (14)`. A named volume
      # inherits ownership from the image and avoids this pitfall.
      - gw2a-data:/data                           # SQLite + history persistence
      # If you must use a bind mount, fix ownership first: sudo chown -R 65532:65532 ./data
      # - ./data:/data
      # - ./cookie.txt:/app/cookie.txt:ro         # Optional: import this file into the Cookie pool at startup

    environment:
      # Panel login token. Empty = no panel auth, only acceptable when bound to 127.0.0.1.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-in-production}"
      # Optional: pins the /v1/* API key so the panel can't change it.
      # When unset, one is generated on first boot and rotatable in the panel.
      # API_KEY: "sk-gemini-your-key"
      TZ: "${TZ:-UTC}"

    # The image ships CMD ["--db","/data/gemini.db","--port","8083"]; usually no need to change.
    # Only write a command when adding parameters — writing one replaces the
    # default entirely, so don't forget --db.
    # command: ["--db", "/data/gemini.db", "--port", "8083", "--cookie-file", "/app/cookie.txt"]

    healthcheck:
      test: ["CMD", "/app/gemini-web2api", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gw2a-data: