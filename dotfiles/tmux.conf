# MAIN-landscape tmux.conf
# Maus an: Wheel-Events landen hier (statt im Terminal-Scrollback)
set -g mouse on
# Copy-Mode-Auswahl landet via OSC52 in der Browser-Zwischenablage
set -g set-clipboard on

# Mausrad-Mapping:
#  - in TUIs (alternate screen, z.B. opencode): als Bild-auf/Bild-ab an die App
#  - in normaler Shell: tmux-Copy-Mode (Scrollback)
bind -n WheelUpPane if -Ft= 'alternate_on' 'send-keys -t= PageUp' 'copy-mode'
bind -n WheelDownPane if -Ft= 'alternate_on' 'send-keys -t= PageDown' ''
