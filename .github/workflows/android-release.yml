name: Android Release and Sauce Labs Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  release:
    name: Test, sign, and publish PokemonBattle.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests, lint, and release build
        id: gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon clean testReleaseUnitTest lintRelease assembleRelease 2>&1 | tee "${RUNNER_TEMP}/gradle.log"
          EXIT_CODE="${PIPESTATUS[0]}"
          set -e
          if [[ "$EXIT_CODE" != "0" ]]; then
            SUMMARY="$(grep -E '(^e: |^FAILURE:|What went wrong:|Could not|error:)' "${RUNNER_TEMP}/gradle.log" | tail -n 1 | tr -cd '[:alnum:] ._:/()=-' | cut -c1-100)"
            if [[ -z "$SUMMARY" ]]; then SUMMARY="Gradle build failed."; fi
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
            exit "$EXIT_CODE"
          fi

      - name: Store Gradle diagnostics on failure
        if: failure() && steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: error
          retention-days: 3

      - name: Create temporary signing key and sign release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$UNSIGNED_APK" ]]; then
            echo "::error title=Unsigned APK missing::Expected $UNSIGNED_APK after assembleRelease."
            exit 1
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/pokemon-battle-release.jks"
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="pokemon-battle-release"

          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=Pokemon Battle CI, OU=Android, O=ChatMCPConnector, L=CI, ST=CI, C=DE" \
            -noprompt >/dev/null 2>&1

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          mkdir -p release-output
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "${RUNNER_TEMP}/PokemonBattle-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "release-output/PokemonBattle.apk" \
            "${RUNNER_TEMP}/PokemonBattle-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "release-output/PokemonBattle.apk"
          rm -f "$KEYSTORE_PATH" "${RUNNER_TEMP}/PokemonBattle-aligned.apk"

          APK_COUNT="$(find release-output -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "$APK_COUNT" != "1" ]]; then
            echo "::error title=Unexpected APK count::Expected exactly one published APK, found $APK_COUNT."
            find release-output -maxdepth 1 -type f -print
            exit 1
          fi
          if [[ ! -f "release-output/PokemonBattle.apk" ]]; then
            echo "::error title=Final APK missing::PokemonBattle.apk was not created."
            exit 1
          fi

          echo "path=release-output/PokemonBattle.apk" >> "$GITHUB_OUTPUT"

      - name: Store exactly one GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonBattle
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload PokemonBattle.apk to Sauce Labs Europe
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SAUCE_USERNAME:-}" || -z "${SAUCE_ACCESS_KEY:-}" ]]; then
            echo "::error title=Missing Sauce Labs secrets::Configure SAUCE_USERNAME and SAUCE_ACCESS_KEY as GitHub Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --user "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            --form "payload=@${APK_PATH}" \
            --form "name=PokemonBattle.apk" \
            --output "${RUNNER_TEMP}/sauce-upload-response.json" \
            "https://api.eu-central-1.saucelabs.com/v1/storage/upload"

          echo "PokemonBattle.apk uploaded to Sauce Labs Europe. No device session was started."

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          FAILURE_SUMMARY: ${{ steps.gradle.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE="success"; DESCRIPTION="Tests, signing, artifact and Sauce upload succeeded." ;;
            cancelled) STATE="error"; DESCRIPTION="Android release workflow was cancelled." ;;
            *)
              STATE="failure"
              if [[ -n "${FAILURE_SUMMARY:-}" ]]; then
                DESCRIPTION="Build failed: ${FAILURE_SUMMARY}"
              else
                DESCRIPTION="Android release workflow failed. Inspect the Actions log."
              fi
              ;;
          esac

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"${DESCRIPTION}\",\"context\":\"pokemon-battle/release\"}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
