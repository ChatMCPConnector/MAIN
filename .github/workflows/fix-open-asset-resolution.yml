name: Fix open asset resolution

on:
  push:
    branches:
      - visual/cc0-arena-upgrade
    paths:
      - '.github/workflows/fix-open-asset-resolution.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prefer OpenGL normals and avoid false metal-map matches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/open_asset_catalog.py')
          text = path.read_text(encoding='utf-8')
          old_alias = '        "metal": ("metal", "metallic"),\n'
          new_alias = '        "metal": ("metallic", "_metal_", "-metal-", "/metal/"),\n'
          if old_alias not in text:
              raise SystemExit('Metal-map alias anchor not found')
          text = text.replace(old_alias, new_alias, 1)
          old_normal = '''        matching = [item for item in candidates if any(alias in f" {item.haystack} " for alias in aliases)]
          if not matching:
              continue
          best = choose_best(matching, request)
          '''
          new_normal = '''        matching = [item for item in candidates if any(alias in f" {item.haystack} " for alias in aliases)]
          if not matching:
              continue
          if map_name == "normal":
              open_gl = [
                  item
                  for item in matching
                  if any(alias in item.haystack for alias in ("nor_gl", "normal_gl", "opengl"))
              ]
              if open_gl:
                  matching = open_gl
          best = choose_best(matching, request)
          '''
          if old_normal not in text:
              raise SystemExit('Normal-map selection anchor not found')
          path.write_text(text.replace(old_normal, new_normal, 1), encoding='utf-8')
          PY
      - run: python tools/asset_pipeline.py validate
      - run: python tools/asset_pipeline.py resolve
      - run: python tools/validate_project.py
      - name: Publish correction
        shell: bash
        run: |
          rm .github/workflows/fix-open-asset-resolution.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden open asset texture resolution"
          git push
