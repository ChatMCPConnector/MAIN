name: Temporary PR18 Source Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-pr-branch:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-release-build
          fetch-depth: 0

      - name: Apply exact compiler fixes
        shell: python
        run: |
          import re
          from pathlib import Path

          combat_path = Path("Assets/Game/Coop/CoopCombatWorld.cs")
          combat = combat_path.read_text()
          combat = re.sub(
              r"(?<!UnityEngine\.Object\.)FindObjectsByType<EnemyController>\(FindObjectsSortMode\.None\)",
              "UnityEngine.Object.FindObjectsByType<EnemyController>(FindObjectsSortMode.None)",
              combat,
          )
          if len(re.findall(r"UnityEngine\.Object\.FindObjectsByType<EnemyController>", combat)) != 4:
              raise SystemExit("Enemy object searches were not corrected exactly four times")
          combat_path.write_text(combat)

          lan_path = Path("Assets/Game/Coop/CoopLanController.cs")
          lan = lan_path.read_text()
          lan = lan.replace(
              "TryDecodeWelcome(payload, out var code, out var hostToken, out var hostSeed, out var hostRoom)",
              "TryDecodeWelcome(payload, out var welcomeCode, out var hostToken, out var hostSeed, out var hostRoom)",
          )
          lan = lan.replace(
              "if (code != sessionCode || !EndpointsEqual(sender, remoteEndpoint)) return;",
              "if (welcomeCode != sessionCode || !EndpointsEqual(sender, remoteEndpoint)) return;",
          )
          if "TryDecodeWelcome(payload, out var welcomeCode" not in lan or "if (welcomeCode != sessionCode" not in lan:
              raise SystemExit("Welcome packet variable was not corrected")
          lan_path.write_text(lan)

          quality_path = Path("Assets/Game/Core/ReleaseQualityRuntime.cs")
          quality = quality_path.read_text()
          quality = quality.replace("? ShadowQuality.HardOnly", "? UnityEngine.ShadowQuality.HardOnly")
          quality = quality.replace(": ShadowQuality.Disable;", ": UnityEngine.ShadowQuality.Disable;")
          if "? UnityEngine.ShadowQuality.HardOnly" not in quality or ": UnityEngine.ShadowQuality.Disable;" not in quality:
              raise SystemExit("Shadow quality references were not corrected")
          quality_path.write_text(quality)

          branch_helper = Path(".github/workflows/apply-android-source-fixes.yml")
          if branch_helper.exists():
              branch_helper.unlink()

      - name: Commit corrected PR sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix remaining Android compiler errors"
            git push origin HEAD:fix/android-release-build
          fi

      - name: Remove temporary workflow from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/temporary-pr18-source-fix.yml
          git commit -m "[skip ci] Remove temporary PR 18 source fixer"
          git push origin HEAD:main
