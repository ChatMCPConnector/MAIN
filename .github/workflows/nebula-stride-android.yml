name: Nebula Stride Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-stride-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  GODOT_BIN: .tools/godot
  TEMPLATE_DIR: .godot-ci-templates

jobs:
  build-test-emulator-upload:
    name: Build, test, emulate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.1" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ${{ env.TEMPLATE_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools "${TEMPLATE_DIR}"
          if [[ ! -x "${GODOT_BIN}" ]]; then
            curl --fail-with-body --location --retry 4 --connect-timeout 30 --max-time 600 --output /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d .tools
            mv ".tools/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "${GODOT_BIN}"
            chmod +x "${GODOT_BIN}"
          fi
          if [[ ! -f "${TEMPLATE_DIR}/android_debug.apk" ]]; then
            curl --fail-with-body --location --retry 4 --connect-timeout 30 --max-time 900 --output /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
            rm -rf /tmp/godot-template-unpack
            mkdir -p /tmp/godot-template-unpack
            unzip -q /tmp/templates.tpz -d /tmp/godot-template-unpack
            cp -a /tmp/godot-template-unpack/templates/. "${TEMPLATE_DIR}/"
          fi
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -a "${TEMPLATE_DIR}/." "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          "${GODOT_BIN}" --version

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --editor --path . --quit-after 8 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            exit 1
          fi

      - name: Run deterministic headless tests
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --script tests/test_runner.gd 2>&1 | tee headless-tests.log

      - name: Create temporary signing keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/keys" build
          keytool -genkeypair -v -keystore "${RUNNER_TEMP}/keys/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Nebula Stride,C=DE" -noprompt
          RELEASE_PASSWORD="$(openssl rand -hex 20)"
          export RELEASE_PASSWORD
          keytool -genkeypair -v -keystore "${RUNNER_TEMP}/keys/release.jks" \
            -storepass "${RELEASE_PASSWORD}" -alias nebula-stride -keypass "${RELEASE_PASSWORD}" \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=Nebula Stride CI,O=ChatMCPConnector,C=DE" -noprompt
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('export_presets.cfg')
          text = path.read_text()
          debug = str(Path(os.environ['RUNNER_TEMP']) / 'keys/debug.keystore')
          release = str(Path(os.environ['RUNNER_TEMP']) / 'keys/release.jks')
          password = os.environ['RELEASE_PASSWORD']
          text = text.replace('keystore/debug=""', f'keystore/debug="{debug}"')
          text = text.replace('keystore/release=""', f'keystore/release="{release}"')
          text = text.replace('keystore/release_user=""', 'keystore/release_user="nebula-stride"')
          text = text.replace('keystore/release_password=""', f'keystore/release_password="{password}"')
          path.write_text(text)
          PY

      - name: Export Android APKs
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --export-debug "Android Debug" build/NebulaStride-debug.apk 2>&1 | tee export-debug.log
          "${GODOT_BIN}" --headless --path . --export-release "Android Release" build/NebulaStride-release.apk 2>&1 | tee export-release.log
          "${GODOT_BIN}" --headless --path . --export-release "Android Emulator" build/NebulaStride-emulator-x86_64.apk 2>&1 | tee export-emulator.log
          test -s build/NebulaStride-debug.apk
          test -s build/NebulaStride-release.apk
          test -s build/NebulaStride-emulator-x86_64.apk

      - name: Verify package, permissions, architectures, and signatures
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.1/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner"
          "$AAPT" dump badging build/NebulaStride-release.apk | tee apk-badging.txt
          "$AAPT" dump permissions build/NebulaStride-release.apk | tee apk-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs build/NebulaStride-release.apk | tee apk-signature.txt
          grep -q "package: name='com.chatmcpconnector.nebulastride'" apk-badging.txt
          grep -q "uses-feature: name='android.hardware.screen.landscape'" apk-badging.txt
          if grep -q "android.permission.INTERNET" apk-permissions.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi
          unzip -l build/NebulaStride-release.apk | tee apk-files.txt
          grep -q "lib/arm64-v8a/" apk-files.txt
          if grep -q "lib/x86_64/" apk-files.txt; then
            echo "Release APK unexpectedly contains x86_64"
            exit 1
          fi
          unzip -l build/NebulaStride-debug.apk | tee apk-debug-files.txt
          grep -q "lib/x86_64/" apk-debug-files.txt
          unzip -l build/NebulaStride-emulator-x86_64.apk | tee apk-emulator-files.txt
          grep -q "lib/x86_64/" apk-emulator-files.txt
          if grep -q "lib/arm64-v8a/" apk-emulator-files.txt; then
            echo "Emulator APK unexpectedly contains arm64-v8a"
            exit 1
          fi
          "$APKSIGNER" verify --verbose build/NebulaStride-emulator-x86_64.apk

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Run Android emulator smoke test
        shell: bash
        timeout-minutes: 18
        run: bash .github/scripts/android-emulator-smoke.sh

      - name: Symbolicate Android native crash
        if: failure()
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          CRASH_LOG="test-artifacts/native-crash-dropbox.txt"
          OUTPUT="test-artifacts/symbolicated-crash.txt"
          if [[ ! -s "${CRASH_LOG}" ]] || ! grep -q "libgodot_android.so" "${CRASH_LOG}"; then
            echo "No Godot native crash found to symbolicate." | tee "${OUTPUT}"
            exit 0
          fi

          SYMBOL_ARCHIVE="/tmp/godot-android-symbols.zip"
          SYMBOL_ROOT="/tmp/godot-android-symbols"
          curl --fail-with-body --location --retry 4 --connect-timeout 30 --max-time 1200 \
            --output "${SYMBOL_ARCHIVE}" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_native_debug_symbols.${GODOT_VERSION}.${GODOT_STATUS}.template_release.android.zip"
          rm -rf "${SYMBOL_ROOT}"
          mkdir -p "${SYMBOL_ROOT}"
          unzip -q "${SYMBOL_ARCHIVE}" -d "${SYMBOL_ROOT}"
          find "${SYMBOL_ROOT}" -type f | sort > test-artifacts/native-symbol-files.txt

          SYMBOL_FILE="$(find "${SYMBOL_ROOT}" -type f -path '*/x86_64/*' \
            \( -name 'libgodot_android.so' -o -name 'libgodot_android.so.debug' \) | head -n 1)"
          if [[ -z "${SYMBOL_FILE}" ]]; then
            echo "Matching x86_64 libgodot_android symbol file was not found." | tee "${OUTPUT}"
            exit 1
          fi
          mkdir -p /tmp/ndk-symbols
          cp "${SYMBOL_FILE}" /tmp/ndk-symbols/libgodot_android.so

          NDK_STACK="$(find "${ANDROID_SDK_ROOT}/ndk" -type f -name ndk-stack 2>/dev/null | sort | tail -n 1 || true)"
          if [[ -z "${NDK_STACK}" ]]; then
            sdkmanager "ndk;27.2.12479018"
            NDK_STACK="${ANDROID_SDK_ROOT}/ndk/27.2.12479018/ndk-stack"
          fi
          test -x "${NDK_STACK}"

          awk 'found || /^\*\*\* \*\*\*/ { found=1; print }' "${CRASH_LOG}" > /tmp/godot-crash.txt
          "${NDK_STACK}" -sym /tmp/ndk-symbols -dump /tmp/godot-crash.txt | tee "${OUTPUT}"

      - name: Validate screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          paths = sorted(p for p in Path('test-artifacts/screenshots').glob('*.png') if not p.name.startswith('99-'))
          if len(paths) < 6:
              raise SystemExit(f'Expected six screenshots, found {len(paths)}')
          for path in paths:
              data = path.read_bytes()
              if len(data) < 20000 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid or suspiciously small PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1280, 720):
                  raise SystemExit(f'{path}: unexpected size {(width, height)}')
              print(path, width, height, len(data))
          PY

      - name: Upload build and diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NebulaStride-build-and-tests
          path: |
            build/NebulaStride-debug.apk
            build/NebulaStride-release.apk
            build/NebulaStride-emulator-x86_64.apk
            test-artifacts/
            *.log
            apk-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK to Sauce Labs Europe
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "${SAUCE_USERNAME:-}"
          test -n "${SAUCE_ACCESS_KEY:-}"
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --user "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            --form "payload=@build/NebulaStride-release.apk" \
            --form "name=NebulaStride-release.apk" \
            --output sauce-upload-response.json \
            "https://api.eu-central-1.saucelabs.com/v1/storage/upload"
          python3 -m json.tool sauce-upload-response.json
          echo "Release APK uploaded. No Sauce Labs device session was started."
