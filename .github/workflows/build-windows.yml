name: Build and verify portable Windows game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  GAME_NAME: NeonRift

jobs:
  validate:
    name: Validate source and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/validate_project.py
      - name: Verify documentation references
        run: |
          grep -q "No external game assets" ASSET_LICENSES.md
          grep -q "Godot 4.7.1" BUILDING.md

  godot-tests:
    name: Godot headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download official Godot editor
        run: |
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64
      - name: Import and run tests
        run: |
          mkdir -p artifacts/test-logs
          set -o pipefail
          GODOT=.godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64
          timeout 90s "$GODOT" --headless --editor --path . --quit-after 3 2>&1 | tee artifacts/test-logs/import.log
          timeout 90s "$GODOT" --headless --path . --script tests/test_runner.gd 2>&1 | tee artifacts/test-logs/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonRift-Godot-Test-Logs
          path: artifacts/test-logs
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    name: Render visual smoke gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Download official Godot editor
        run: |
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64
      - name: Capture gallery
        run: |
          mkdir -p artifacts/screenshots artifacts/capture-logs
          set -o pipefail
          GODOT=.godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64
          timeout 90s "$GODOT" --headless --editor --path . --quit-after 3 2>&1 | tee artifacts/capture-logs/import.log
          timeout 60s xvfb-run -a "$GODOT" --path . -- --capture-ci 2>&1 | tee artifacts/capture-logs/capture.log
          test "$(find artifacts/screenshots -name '*.png' | wc -l)" -ge 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonRift-Visual-Smoke-Gallery
          path: |
            artifacts/screenshots
            artifacts/capture-logs
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: Windows export and launch check
    needs: [validate, godot-tests]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download official Godot editor and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-$env:GODOT_STATUS"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS`_win64.exe.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS`_export_templates.tpz" -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath .godot-bin
          Expand-Archive templates.zip -DestinationPath .godot-templates
          $template = Get-ChildItem .godot-templates -Recurse -Filter windows_release_x86_64.exe | Select-Object -First 1
          if ($null -eq $template) { throw "Official Windows release template was not found after extraction" }
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item ".godot-templates/templates/*" $dest -Recurse -Force
          "WINDOWS_TEMPLATE=$($template.FullName)" | Add-Content $env:GITHUB_ENV
          Write-Host "Using official template: $($template.FullName)"
      - name: Import and export release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/NeonRift-Windows-Portable,dist/windows-logs | Out-Null
          $godot = (Resolve-Path ".godot-bin/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS`_win64.exe").Path
          $templatePath = $env:WINDOWS_TEMPLATE.Replace('\','/')
          $preset = Get-Content export_presets.cfg -Raw
          $preset = $preset.Replace('custom_template/release=""', "custom_template/release=`"$templatePath`"")
          Set-Content -Path export_presets.cfg -Value $preset -Encoding utf8NoBOM
          & $godot --headless --editor --path . --quit-after 3 --verbose 2>&1 | Tee-Object -FilePath dist/windows-logs/import.log
          if ($LASTEXITCODE -ne 0) { throw "Godot project import failed with exit code $LASTEXITCODE" }
          & $godot --headless --path . --export-release "Windows Desktop" "dist/NeonRift-Windows-Portable/NeonRift.exe" --verbose 2>&1 | Tee-Object -FilePath dist/windows-logs/export.log
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist/NeonRift-Windows-Portable -Recurse | Select-Object FullName,Length | Format-Table | Out-String | Set-Content dist/windows-logs/export-file-list.txt
          if (!(Test-Path "dist/NeonRift-Windows-Portable/NeonRift.exe")) { throw "Windows export reported success but NeonRift.exe is missing" }
          if (!(Test-Path "dist/NeonRift-Windows-Portable/NeonRift.pck")) { throw "Windows export reported success but NeonRift.pck is missing" }
      - name: Assemble portable package
        shell: pwsh
        run: |
          Copy-Item README.md dist/NeonRift-Windows-Portable/README.txt
          Copy-Item CONTROLS.md dist/NeonRift-Windows-Portable/CONTROLS.txt
          Copy-Item ASSET_LICENSES.md dist/NeonRift-Windows-Portable/LICENSES.txt
          Copy-Item LICENSE dist/NeonRift-Windows-Portable/LICENSE.txt
          "Version 1.0.0`nGodot 4.7.1 stable`nPortable x86_64 build" | Set-Content dist/NeonRift-Windows-Portable/VERSION.txt
          Get-ChildItem dist/NeonRift-Windows-Portable | Select-Object Name,Length | Format-Table | Out-String | Set-Content dist/binary-manifest.txt
      - name: Launch exported EXE in headless smoke mode
        shell: pwsh
        run: |
          $diagnostics = "dist/windows-smoke"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $exe = (Resolve-Path "dist/NeonRift-Windows-Portable/NeonRift.exe").Path
          $working = (Resolve-Path "dist/NeonRift-Windows-Portable").Path
          $stdout = (Join-Path (Resolve-Path $diagnostics).Path "stdout.log")
          $stderr = (Join-Path (Resolve-Path $diagnostics).Path "stderr.log")
          $process = Start-Process -FilePath $exe -ArgumentList @("--headless", "--", "--smoke-test") -WorkingDirectory $working -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            "TIMEOUT" | Set-Content (Join-Path $diagnostics "exit-code.txt")
            throw "Smoke process did not exit within 30 seconds"
          }
          $process.ExitCode | Set-Content (Join-Path $diagnostics "exit-code.txt")
          Get-ChildItem "dist/NeonRift-Windows-Portable" -Recurse | Select-Object FullName,Length | Format-Table | Out-String | Set-Content (Join-Path $diagnostics "file-list.txt")
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if (!(Test-Path "dist/NeonRift-Windows-Portable/smoke-test.log")) { throw "Smoke log missing" }
          Get-Content "dist/NeonRift-Windows-Portable/smoke-test.log"
          if ($process.ExitCode -ne 0) { throw "Smoke process exited with $($process.ExitCode)" }
          Select-String -Path "dist/NeonRift-Windows-Portable/smoke-test.log" -Pattern "PASS"
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonRift-Windows-Diagnostics
          path: |
            dist/windows-logs
            dist/windows-smoke
            dist/binary-manifest.txt
            dist/NeonRift-Windows-Portable/smoke-test.log
          if-no-files-found: warn
          retention-days: 14
      - name: Package and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NeonRift-Windows-Portable -DestinationPath dist/NeonRift-Windows-Portable.zip -CompressionLevel Optimal
          $files = @("dist/NeonRift-Windows-Portable.zip", "dist/NeonRift-Windows-Portable/NeonRift.exe", "dist/NeonRift-Windows-Portable/NeonRift.pck")
          $lines = foreach ($file in $files) { $h = Get-FileHash $file -Algorithm SHA256; "$($h.Hash.ToLower())  $file" }
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Basic binary safety inspection
        shell: pwsh
        run: |
          Get-ChildItem dist/NeonRift-Windows-Portable -Recurse | Select-Object FullName,Length | Format-Table
          if (Get-ChildItem dist/NeonRift-Windows-Portable -Recurse -Include *.bat,*.cmd,*.ps1,*.vbs,*.msi) { throw "Unexpected executable helper found" }
      - uses: actions/upload-artifact@v4
        with:
          name: NeonRift-Windows-Portable
          path: |
            dist/NeonRift-Windows-Portable.zip
            dist/SHA256SUMS.txt
            dist/binary-manifest.txt
            dist/NeonRift-Windows-Portable/smoke-test.log
          if-no-files-found: error
          retention-days: 30
