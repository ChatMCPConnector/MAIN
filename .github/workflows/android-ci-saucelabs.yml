name: Android CI and Sauce Labs Upload

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test, build, and upload Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          if [[ ! -f gradlew ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build skipped::No gradlew file was found in the repository root."
            exit 0
          fi

          if ! find . -type f -path '*/src/main/AndroidManifest.xml' -print -quit | grep -q . \
            && ! grep -R -E -l \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              'com\.android\.(application|library|dynamic-feature|test)|^[[:space:]]*android[[:space:]]*\{' \
              . >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build skipped::No Android project markers were found."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.android.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test and build app and Espresso APKs
        if: steps.android.outputs.available == 'true'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Prepare APK files
        if: steps.android.outputs.available == 'true'
        id: apk
        shell: bash
        run: |
          SOURCE_APP_APK="$(find . -type f -path '*/build/outputs/apk/debug/app-debug.apk' -print -quit)"
          SOURCE_TEST_APK="$(find . -type f -path '*/build/outputs/apk/androidTest/debug/*-debug-androidTest.apk' -print -quit)"

          if [[ -z "$SOURCE_APP_APK" ]]; then
            echo "::error title=App APK missing::The Gradle build completed, but app-debug.apk was not found."
            exit 1
          fi

          if [[ -z "$SOURCE_TEST_APK" ]]; then
            echo "::error title=Test APK missing::The Gradle build completed, but the Espresso test APK was not found."
            exit 1
          fi

          APP_APK_PATH="${RUNNER_TEMP}/app-debug.apk"
          TEST_APK_PATH="${RUNNER_TEMP}/app-debug-androidTest.apk"
          cp "$SOURCE_APP_APK" "$APP_APK_PATH"
          cp "$SOURCE_TEST_APK" "$TEST_APK_PATH"

          echo "app_path=$APP_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "test_path=$TEST_APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Store APKs as GitHub artifact
        if: steps.android.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-sauce-labs-apks
          path: |
            ${{ steps.apk.outputs.app_path }}
            ${{ steps.apk.outputs.test_path }}
          if-no-files-found: error

      - name: Upload APKs to Sauce Labs Europe
        if: steps.android.outputs.available == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        shell: bash
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          APP_APK_PATH: ${{ steps.apk.outputs.app_path }}
          TEST_APK_PATH: ${{ steps.apk.outputs.test_path }}
        run: |
          if [[ -z "${SAUCE_USERNAME:-}" || -z "${SAUCE_ACCESS_KEY:-}" ]]; then
            echo "::error title=Missing Sauce Labs secrets::Configure SAUCE_USERNAME and SAUCE_ACCESS_KEY as GitHub Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --user "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            --form "payload=@${APP_APK_PATH}" \
            --form "name=app-debug.apk" \
            --output /dev/null \
            "https://api.eu-central-1.saucelabs.com/v1/storage/upload"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --user "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            --form "payload=@${TEST_APK_PATH}" \
            --form "name=app-debug-androidTest.apk" \
            --output /dev/null \
            "https://api.eu-central-1.saucelabs.com/v1/storage/upload"

          echo "App and Espresso APKs uploaded to Sauce Labs Europe."
