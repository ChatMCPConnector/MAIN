name: Riftbound Android PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftbound-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Assets/Game/Editor/BuildAutomation.cs
          test -f Assets/Plugins/Android/AndroidManifest.xml
          grep -q '6000.3.20f1' ProjectSettings/ProjectVersion.txt
          grep -q 'bundleVersion = "1.0.1"' Assets/Game/Editor/BuildAutomation.cs
          grep -q 'bundleVersionCode = 101' Assets/Game/Editor/BuildAutomation.cs
          grep -q 'BuildOptions.None' Assets/Game/Editor/BuildAutomation.cs
          ! grep -q 'BuildOptions.Development' Assets/Game/Editor/BuildAutomation.cs
          grep -q 'com.unity3d.player.UnityPlayerGameActivity' Assets/Plugins/Android/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' Assets/Plugins/Android/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' Assets/Plugins/Android/AndroidManifest.xml
          grep -q 'android:exported="true"' Assets/Plugins/Android/AndroidManifest.xml

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Preserve APK analyzer and free disk space
        shell: bash
        run: |
          set -euo pipefail
          aapt_source="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -x "$aapt_source"
          build_tools="$(dirname "$aapt_source")"
          sudo rm -rf /opt/android-build-tools
          sudo cp -a "$build_tools" /opt/android-build-tools
          echo "/opt/android-build-tools" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/android-build-tools/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /opt/ghc || true
          LD_LIBRARY_PATH="/opt/android-build-tools/lib64:${LD_LIBRARY_PATH:-}" /opt/android-build-tools/aapt version
          df -h

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.20f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.cs', 'Assets/Plugins/Android/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.20f1-

      - name: Run all EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        continue-on-error: true
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify EditMode NUnit results
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path('test-artifacts/editmode-results.xml')
          if not path.is_file():
              raise SystemExit('Unity did not produce EditMode test results')
          root = ET.parse(path).getroot()
          total = int(root.attrib.get('total', '0'))
          passed = int(root.attrib.get('passed', '0'))
          failed = int(root.attrib.get('failed', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          result = root.attrib.get('result', '')
          print(f'Unity EditMode: result={result}, total={total}, passed={passed}, failed={failed}, skipped={skipped}')
          if result != 'Passed' or total <= 0 or failed != 0 or passed != total:
              raise SystemExit('Unity EditMode tests did not pass completely')

      - name: Build Android release APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          buildMethod: Riftbound.Editor.BuildAutomation.BuildAndroid
          versioning: None
          allowDirtyBuild: true
          buildName: Riftbound
          buildPath: Builds/Android

      - name: Normalize and verify APK
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/Builds/Android/Riftbound.apk"
          source="$(find "$GITHUB_WORKSPACE" -type f -iname '*.apk' -printf '%s\t%p\n' | sort -nr | head -n 1 | cut -f 2-)"
          if [ -z "$source" ] || [ ! -s "$source" ]; then
            echo "Unity reported success but no APK was found" >&2
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -print | sort
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          if [ "$(realpath "$source")" != "$(realpath -m "$target")" ]; then
            cp "$source" "$target"
          fi
          size="$(stat -c%s "$target")"
          if [ "$size" -lt 10000000 ]; then
            echo "APK is unexpectedly small: $size bytes" >&2
            exit 1
          fi
          unzip -tq "$target"
          badging="$(aapt dump badging "$target")"
          echo "$badging"
          grep -F "package: name='com.chatmcpconnector.riftbound' versionCode='101' versionName='1.0.1'" <<<"$badging"
          grep -F "launchable-activity: name='com.unity3d.player.UnityPlayerGameActivity'" <<<"$badging"
          file "$target"
          sha256sum "$target"
          ls -lh "$target"

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-android-1.0.1-pr-${{ github.event.pull_request.number }}
          path: |
            Builds/Android/Riftbound.apk
            test-artifacts
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
