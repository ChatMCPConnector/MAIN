name: Resolve configured open assets

on:
  push:
    paths:
      - 'AssetSources/open-assets.json'
      - 'AssetSources/providers.json'
      - 'tools/asset_pipeline.py'
      - 'tools/open_asset_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Apply hardening and resolve open assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply targeted repository hardening
        run: python tools/apply_repository_hardening.py

      - name: Validate global providers and asset requests
        run: python tools/asset_pipeline.py validate

      - name: Resolve provider IDs to audited download metadata
        run: python tools/asset_pipeline.py resolve

      - name: Show resolved catalog
        run: cat AssetSources/open-assets.lock.json

      - name: Commit hardened repository
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The repository is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix gameplay lifecycle, assets and CI verification"
          git push
