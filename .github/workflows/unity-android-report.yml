name: Riftbound Android Build Reporter

on:
  workflow_run:
    workflows: ["Riftbound Android 1.0"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: riftbound-build-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS: ${{ github.event.workflow_run.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p Builds/actions-status
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "workflow": "Riftbound Android 1.0",
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "status": os.environ["STATUS"],
              "conclusion": os.environ["CONCLUSION"],
              "head_sha": os.environ["HEAD_SHA"],
              "event": os.environ["EVENT_NAME"],
              "html_url": os.environ["HTML_URL"],
              "updated_at": os.environ["UPDATED_AT"],
              "artifact_name": "riftbound-android-1.0.0",
          }
          payload = json.dumps(data, indent=2, sort_keys=True) + "\n"
          Path("Builds/latest-actions-status.json").write_text(payload)
          Path(f"Builds/actions-status/{data['run_id']}.json").write_text(payload)
          PY

      - name: Commit workflow result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Builds/latest-actions-status.json Builds/actions-status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Riftbound Android build ${{ github.event.workflow_run.id }}"
          git push origin HEAD:main
