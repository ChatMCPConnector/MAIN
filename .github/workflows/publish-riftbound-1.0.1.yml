name: Publish Riftbound Android 1.0.1

on:
  issues:
    types: [reopened]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.issue.number == 19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_ID: "8689121088"
      SOURCE_RUN_ID: "30361063152"
      SOURCE_COMMIT: "e0232d343f81f8155f04b32f1f1f05faaf925467"
      RELEASE_COMMIT: "cb373b5a67157945852e402e0be8507864b5102f"
      TAG: "v1.0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Android artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          source="$(find artifact -type f -iname '*.apk' -printf '%s\t%p\n' | sort -nr | head -n 1 | cut -f 2-)"
          test -n "$source"
          cp "$source" Riftbound-1.0.1.apk

      - name: Verify launcher APK
        shell: bash
        run: |
          set -euo pipefail
          apk="Riftbound-1.0.1.apk"
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          test "$size" -ge 10000000
          unzip -tq "$apk"
          aapt="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          echo "$badging"
          grep -F "package: name='com.chatmcpconnector.riftbound' versionCode='101' versionName='1.0.1'" <<<"$badging"
          grep -F "launchable-activity: name='com.unity3d.player.UnityPlayerGameActivity'" <<<"$badging"
          sha256sum "$apk" | tee Riftbound-1.0.1.sha256

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            Riftbound-1.0.1.apk \
            Riftbound-1.0.1.sha256 \
            --target "$RELEASE_COMMIT" \
            --title "Riftbound Android 1.0.1" \
            --notes "Fixes the missing Android launcher icon. The APK now exposes UnityPlayerGameActivity as an exported MAIN/LAUNCHER activity and passed Unity tests, APK integrity checks, version checks, and aapt launchable-activity verification."

      - name: Record release and remove publisher
        run: |
          set -euo pipefail
          mkdir -p Builds
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path('Riftbound-1.0.1.apk')
          data = {
              'tag': os.environ['TAG'],
              'title': 'Riftbound Android 1.0.1',
              'release_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['TAG']}",
              'apk_asset': apk.name,
              'apk_size_bytes': apk.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'checksum_asset': 'Riftbound-1.0.1.sha256',
              'source_artifact_id': int(os.environ['ARTIFACT_ID']),
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_commit': os.environ['SOURCE_COMMIT'],
              'release_commit': os.environ['RELEASE_COMMIT'],
              'launcher_activity': 'com.unity3d.player.UnityPlayerGameActivity',
          }
          Path('Builds/riftbound-1.0.1-release.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git rm .github/workflows/publish-riftbound-1.0.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Builds/riftbound-1.0.1-release.json
          git commit -m "[skip ci] Publish Riftbound Android 1.0.1 release"
          git push origin HEAD:main
