name: Diagnose Unity CI activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-cli-license-probe:
    name: Inspect official Unity CLI licensing support
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install official Unity CLI beta
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Capture CLI version and licensing help
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          UNITY_BIN="$(command -v unity || true)"
          if [[ -z "$UNITY_BIN" ]]; then
            UNITY_BIN="$(find "$HOME" -type f -name unity -perm -111 2>/dev/null | head -n 1)"
          fi
          if [[ -z "$UNITY_BIN" ]]; then
            echo 'Unity CLI binary not found after installation.' | tee ci-diagnostics/unity-cli-help.txt
            exit 1
          fi
          {
            echo "unity_bin=$UNITY_BIN"
            echo '===== version ====='
            "$UNITY_BIN" --version
            echo '===== top-level help ====='
            "$UNITY_BIN" --help
            echo '===== auth login help ====='
            "$UNITY_BIN" auth login --help || true
            echo '===== license help ====='
            "$UNITY_BIN" license --help || true
            echo '===== license activate help ====='
            "$UNITY_BIN" license activate --help || true
            echo '===== license status help ====='
            "$UNITY_BIN" license status --help || true
          } > ci-diagnostics/unity-cli-help.txt 2>&1
          cat ci-diagnostics/unity-cli-help.txt

      - name: Upload Unity CLI licensing help
        uses: actions/upload-artifact@v4
        with:
          name: Unity-CLI-Licensing-Help
          path: ci-diagnostics/unity-cli-help.txt
          if-no-files-found: error
          retention-days: 7
