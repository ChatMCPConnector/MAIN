name: Diagnose Unity CI activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.17f1

jobs:
  direct-license-import:
    name: Test direct Unity Personal license import
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Prepare secret license and diagnostics
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          mkdir -p ci-license ci-diagnostics
          printf '%s' "$UNITY_LICENSE" > ci-license/Unity_lic.ulf
          chmod 600 ci-license/Unity_lic.ulf
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ci-license/Unity_lic.ulf').read_text(encoding='utf-8', errors='replace')
          required = ['<License ', 'Product="Unity Personal"', '<Signature']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'UNITY_LICENSE is missing expected markers: {missing}')
          print('Secret contains a signed Unity Personal XML license.')
          print('DeveloperData present:', '<DeveloperData ' in text)
          PY

      - name: Run Unity with direct manual license import
        id: unity
        continue-on-error: true
        uses: game-ci/unity-builder@v5
        env:
          UNITY_SERIAL: CI-DIRECT-ULF-BYPASS
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildMethod: NeonRift.Editor.BuildAutomation.BuildWindows
          buildsPath: diagnostic-build
          buildName: NeonRiftDiagnostic
          skipActivation: true
          customParameters: >-
            -manualLicenseFile /github/workspace/ci-license/Unity_lic.ulf
            -logFile /github/workspace/ci-diagnostics/Editor.log

      - name: Create sanitized diagnostic report
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.unity.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.unity.outputs.engineExitCode }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          output_dir = Path('ci-diagnostics')
          output_dir.mkdir(exist_ok=True)
          report = output_dir / 'direct-import-summary.txt'
          secrets = [os.environ.get('UNITY_EMAIL', ''), os.environ.get('UNITY_PASSWORD', '')]
          secrets = [value for value in secrets if value]
          patterns = re.compile(
              r'error|exception|fail(?:ed|ure)?|licen[cs]e|activat|aborting|'
              r'exit code|not found|invalid|compiler|\bCS\d{4}\b|cannot|denied|'
              r'unauthori[sz]ed|machine|binding|signature', re.IGNORECASE)

          def redact(text: str) -> str:
              for value in secrets:
                  text = text.replace(value, '[REDACTED_SECRET]')
              text = re.sub(r'(?i)(password\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
              return text

          editor_log = output_dir / 'Editor.log'
          lines = editor_log.read_text(encoding='utf-8', errors='replace').splitlines() if editor_log.exists() else []
          selected = set()
          for index, line in enumerate(lines):
              if patterns.search(line):
                  selected.update(range(max(0, index - 4), min(len(lines), index + 5)))
          selected.update(range(max(0, len(lines) - 180), len(lines)))

          sections = [
              'Direct Unity Personal license import diagnostic',
              f"step_outcome={os.environ.get('STEP_OUTCOME', '')}",
              f"engine_exit_code={os.environ.get('ENGINE_EXIT_CODE', '')}",
              f"editor_log_exists={editor_log.exists()}",
              f"editor_log_lines={len(lines)}",
          ]
          if lines:
              sections.extend(['', '===== sanitized Editor.log excerpts ====='])
              previous = -2
              for index in sorted(selected):
                  if index > previous + 1:
                      sections.append('...')
                  sections.append(f'{index + 1}: {redact(lines[index])}')
                  previous = index

          report.write_text('\n'.join(sections) + '\n', encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Remove secret license file
        if: always()
        shell: bash
        run: rm -rf ci-license

      - name: Upload sanitized direct-import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonRift-Unity-Direct-License-Diagnostics
          path: ci-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Unity did not build
        if: steps.unity.outcome != 'success'
        shell: bash
        run: exit 1
