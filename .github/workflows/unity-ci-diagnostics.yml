name: Diagnose Unity CI activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.3.17f1-windows-mono-3

jobs:
  unity-cli-xml-activation:
    name: Activate XML with official Unity CLI and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare secret XML and diagnostics
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE"
          mkdir -p ci-license ci-diagnostics
          printf '%s' "$UNITY_LICENSE" > ci-license/UnityEntitlementLicense.xml
          chmod 600 ci-license/UnityEntitlementLicense.xml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ci-license/UnityEntitlementLicense.xml').read_text(encoding='utf-8', errors='replace')
          required = ['<License ', 'Product="Unity Personal"', '<Signature']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'UNITY_LICENSE is missing expected markers: {missing}')
          print('Secret contains signed Unity Personal entitlement XML.')
          print('DeveloperData present:', '<DeveloperData ' in text)
          PY

      - name: Pull Unity image
        shell: bash
        run: docker pull "$UNITY_IMAGE"

      - name: Activate XML with Unity CLI and build
        id: unity
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            "$UNITY_IMAGE" \
            bash -lc '
              set +e
              export HOME=/root
              mkdir -p /github/workspace/ci-diagnostics

              curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
                | UNITY_CLI_CHANNEL=beta bash \
                > /github/workspace/ci-diagnostics/cli-install.log 2>&1
              install_exit=$?
              echo "$install_exit" > /github/workspace/ci-diagnostics/cli-install-exit-code.txt
              if [[ $install_exit -ne 0 ]]; then
                exit $install_exit
              fi

              export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
              UNITY_CLI="$(command -v unity || true)"
              echo "unity_cli=${UNITY_CLI:-missing}" > /github/workspace/ci-diagnostics/container-probe.txt
              echo "unity_editor=${UNITY_PATH:-/opt/unity}/Editor/Unity" >> /github/workspace/ci-diagnostics/container-probe.txt
              if [[ -z "$UNITY_CLI" ]]; then
                exit 91
              fi

              "$UNITY_CLI" --non-interactive --verbose license activate \
                --file /github/workspace/ci-license/UnityEntitlementLicense.xml \
                --accept-eula \
                > /github/workspace/ci-diagnostics/cli-activation.log 2>&1
              activation_exit=$?
              echo "$activation_exit" > /github/workspace/ci-diagnostics/activation-exit-code.txt

              "$UNITY_CLI" --non-interactive --format json license status \
                > /github/workspace/ci-diagnostics/cli-license-status.json 2>&1
              status_exit=$?
              echo "$status_exit" > /github/workspace/ci-diagnostics/status-exit-code.txt

              if [[ $activation_exit -ne 0 ]]; then
                exit $activation_exit
              fi

              UNITY_BIN="${UNITY_PATH:-/opt/unity}/Editor/Unity"
              if [[ ! -x "$UNITY_BIN" ]]; then
                UNITY_BIN="$(find /opt/unity -type f -path "*/Editor/Unity" -perm -111 2>/dev/null | head -n 1)"
              fi
              if [[ -z "$UNITY_BIN" || ! -x "$UNITY_BIN" ]]; then
                exit 92
              fi

              "$UNITY_BIN" \
                -batchmode -nographics -quit \
                -projectPath /github/workspace \
                -executeMethod NeonRift.Editor.BuildAutomation.BuildWindows \
                -logFile /github/workspace/ci-diagnostics/Editor.log
              build_exit=$?
              echo "$build_exit" > /github/workspace/ci-diagnostics/build-exit-code.txt
              exit $build_exit
            '
          docker_exit=$?
          echo "docker_exit_code=$docker_exit" >> "$GITHUB_OUTPUT"
          exit $docker_exit

      - name: Create sanitized report
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.unity.outcome }}
          DOCKER_EXIT_CODE: ${{ steps.unity.outputs.docker_exit_code }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path('ci-diagnostics')
          root.mkdir(exist_ok=True)
          report = root / 'unity-cli-xml-summary.txt'
          secrets = [os.environ.get('UNITY_EMAIL', ''), os.environ.get('UNITY_PASSWORD', '')]
          secrets = [value for value in secrets if value]
          pattern = re.compile(
              r'error|exception|fail(?:ed|ure)?|licen[cs]e|activat|aborting|'
              r'exit code|not found|invalid|compiler|\bCS\d{4}\b|cannot|denied|'
              r'unauthori[sz]ed|machine|binding|signature|entitlement|token|eula',
              re.IGNORECASE,
          )

          def redact(text: str) -> str:
              for value in secrets:
                  text = text.replace(value, '[REDACTED_SECRET]')
              text = re.sub(r'(?i)(password\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
              text = re.sub(r'(?i)(client[_ -]?secret\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
              return text

          sections = [
              'Unity CLI XML activation diagnostic',
              f"step_outcome={os.environ.get('STEP_OUTCOME', '')}",
              f"docker_exit_code={os.environ.get('DOCKER_EXIT_CODE', '')}",
          ]

          for small in [
              'container-probe.txt', 'cli-install-exit-code.txt',
              'activation-exit-code.txt', 'status-exit-code.txt',
              'build-exit-code.txt',
          ]:
              path = root / small
              if path.exists():
                  sections.extend(['', f'===== {small} =====', redact(path.read_text(errors='replace'))])

          for name in [
              'cli-install.log', 'cli-activation.log',
              'cli-license-status.json', 'Editor.log',
          ]:
              path = root / name
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines() if path.exists() else []
              sections.extend(['', f'===== {name} (exists={path.exists()}, lines={len(lines)}) ====='])
              selected = set(range(max(0, len(lines) - 240), len(lines)))
              for index, line in enumerate(lines):
                  if pattern.search(line):
                      selected.update(range(max(0, index - 5), min(len(lines), index + 6)))
              previous = -2
              for index in sorted(selected):
                  if index > previous + 1:
                      sections.append('...')
                  sections.append(f'{index + 1}: {redact(lines[index])}')
                  previous = index

          report.write_text('\n'.join(sections) + '\n', encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Remove secret XML
        if: always()
        shell: bash
        run: rm -rf ci-license

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonRift-Unity-CLI-XML-Diagnostics
          path: |
            ci-diagnostics/unity-cli-xml-summary.txt
            ci-diagnostics/container-probe.txt
            ci-diagnostics/activation-exit-code.txt
            ci-diagnostics/status-exit-code.txt
            ci-diagnostics/build-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when activation or build failed
        if: steps.unity.outcome != 'success'
        shell: bash
        run: exit 1
