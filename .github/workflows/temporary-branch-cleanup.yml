name: Temporary branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-extra-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            ci/classic-ulf-activation-probe \
            ci/unity-diagnostics-run \
            fix/keyboard-remapping-compression
          do
            if gh api "repos/${GH_REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
