name: Extract Unity Android Build Error

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.head_ref == 'fix/android-release-build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download current Android builder job log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/jobs/90128393905/logs \
            > unity-builder-job.log

      - name: Extract final raw Unity build section
        shell: python
        run: |
          from pathlib import Path

          source = Path('unity-builder-job.log').read_text(
              encoding='utf-8', errors='replace').splitlines()
          start = max(0, len(source) - 5000)
          output = [f'{index + 1}: {source[index]}' for index in range(start, len(source))]
          Path('unity-android-build-errors.txt').write_text(
              '\n'.join(output) + '\n',
              encoding='utf-8',
          )

      - uses: actions/upload-artifact@v4
        with:
          name: unity-android-build-errors
          path: unity-android-build-errors.txt
          if-no-files-found: error
          retention-days: 7
