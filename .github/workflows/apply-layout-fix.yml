name: Apply one-shot character layout fix

on:
  push:
    branches: [neon-rift-final-candidate]

permissions:
  contents: write

jobs:
  fix-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-rift-final-candidate
      - run: python tools/apply_character_select_layout_fix.py
      - name: Commit exact layout fix
        run: |
          if git diff --quiet; then
            echo "No layout fix required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/main.gd
          git commit -m "Fix character selection text overlap"
          git push origin HEAD:neon-rift-final-candidate
