name: Publish Riftbound Android 1.0.0

on:
  issues:
    types: [reopened]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.issue.number == 19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify the green APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id=8687471455
          rm -rf /tmp/riftbound-artifact dist
          mkdir -p /tmp/riftbound-artifact dist
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/riftbound-artifact.zip
          unzip -q /tmp/riftbound-artifact.zip -d /tmp/riftbound-artifact
          source="$(find /tmp/riftbound-artifact -type f -iname '*.apk' -printf '%s\t%p\n' | sort -nr | head -n 1 | cut -f 2-)"
          if [ -z "$source" ] || [ ! -s "$source" ]; then
            echo 'Verified workflow artifact did not contain an APK' >&2
            exit 1
          fi
          cp "$source" dist/Riftbound-1.0.0.apk
          size="$(stat -c%s dist/Riftbound-1.0.0.apk)"
          if [ "$size" -lt 10000000 ]; then
            echo "APK is unexpectedly small: $size bytes" >&2
            exit 1
          fi
          unzip -tq dist/Riftbound-1.0.0.apk
          sha256sum dist/Riftbound-1.0.0.apk | sed 's#dist/##' > dist/Riftbound-1.0.0.sha256
          file dist/Riftbound-1.0.0.apk
          cat dist/Riftbound-1.0.0.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 dist/Riftbound-1.0.0.sha256)"
          size="$(stat -c%s dist/Riftbound-1.0.0.apk)"
          cat > /tmp/release-notes.md <<EOF
          Riftbound Android 1.0.0

          - Unity 6000.3.20f1 release build
          - ARM64 / IL2CPP Android APK
          - Complete EditMode test suite passed
          - APK integrity verification passed
          - APK size: ${size} bytes
          - SHA-256: ${sha}
          EOF
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              'dist/Riftbound-1.0.0.apk#Riftbound-1.0.0.apk' \
              'dist/Riftbound-1.0.0.sha256#Riftbound-1.0.0.sha256' \
              --clobber
            gh release edit v1.0.0 \
              --title 'Riftbound Android 1.0.0' \
              --notes-file /tmp/release-notes.md
          else
            gh release create v1.0.0 \
              'dist/Riftbound-1.0.0.apk#Riftbound-1.0.0.apk' \
              'dist/Riftbound-1.0.0.sha256#Riftbound-1.0.0.sha256' \
              --target main \
              --title 'Riftbound Android 1.0.0' \
              --notes-file /tmp/release-notes.md
          fi
          release_url="$(gh release view v1.0.0 --json url --jq .url)"
          export RELEASE_URL="$release_url" APK_SHA256="$sha" APK_SIZE="$size"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              'tag': 'v1.0.0',
              'title': 'Riftbound Android 1.0.0',
              'release_url': os.environ['RELEASE_URL'],
              'apk_asset': 'Riftbound-1.0.0.apk',
              'checksum_asset': 'Riftbound-1.0.0.sha256',
              'apk_size_bytes': int(os.environ['APK_SIZE']),
              'apk_sha256': os.environ['APK_SHA256'],
              'source_workflow_run_id': 30356191796,
              'source_artifact_id': 8687471455,
              'source_commit': 'e500a3f367c8668a3746d1da46b0938350dce056',
          }
          Path('/tmp/riftbound-release-status.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Record release and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p Builds
          cp /tmp/riftbound-release-status.json Builds/riftbound-1.0.0-release.json
          git rm .github/workflows/publish-riftbound-release.yml
          git add -f Builds/riftbound-1.0.0-release.json
          git commit -m '[skip ci] Publish Riftbound Android 1.0.0 release'
          git push origin HEAD:main
