name: Riftbound Android 1.0.1

on:
  push:
    branches: [main]
    paths-ignore:
      - "Builds/actions-status/**"
      - "Builds/latest-actions-status.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riftbound-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android release configuration
        shell: python
        run: |
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          required_files = [
              'ProjectSettings/ProjectVersion.txt',
              'Packages/manifest.json',
              'Assets/Plugins/Android/AndroidManifest.xml',
              'Assets/Game/Riftbound.Game.asmdef',
              'Assets/Game/Editor/BuildAutomation.cs',
              'Assets/Game/Coop/AndroidLocalNetworkRuntime.cs',
              'Assets/Game/Tests/EditMode/FinalizationTests.cs',
          ]
          missing_files = [path for path in required_files if not Path(path).is_file()]
          if missing_files:
              raise SystemExit(f'Missing release files: {missing_files}')

          version = Path('ProjectSettings/ProjectVersion.txt').read_text()
          if '6000.3.20f1' not in version:
              raise SystemExit('Unexpected Unity version')

          manifest = json.loads(Path('Packages/manifest.json').read_text())
          required_packages = {
              'com.unity.inputsystem',
              'com.unity.modules.androidjni',
              'com.unity.modules.audio',
              'com.unity.render-pipelines.universal',
              'com.unity.test-framework',
              'com.unity.ugui',
          }
          missing_packages = required_packages - set(manifest['dependencies'])
          if missing_packages:
              raise SystemExit(f'Missing Unity packages: {sorted(missing_packages)}')

          asmdef = json.loads(Path('Assets/Game/Riftbound.Game.asmdef').read_text())
          if 'Unity.RenderPipelines.Universal.Runtime' not in asmdef.get('references', []):
              raise SystemExit('URP runtime assembly reference is missing')

          build = Path('Assets/Game/Editor/BuildAutomation.cs').read_text()
          for token in (
              'bundleVersion = "1.0.1"',
              'bundleVersionCode = 101',
              'BuildOptions.None',
              'ScriptingImplementation.IL2CPP',
              'AndroidArchitecture.ARM64',
          ):
              if token not in build:
                  raise SystemExit(f'Android release setting missing: {token}')
          if 'BuildOptions.Development' in build or 'EnableBothInputBackends' in build:
              raise SystemExit('Development mode or runtime input-backend switching remains enabled')

          network_runtime = Path('Assets/Game/Coop/AndroidLocalNetworkRuntime.cs').read_text()
          field = 'private AndroidJavaObject multicastLock;'
          if field not in network_runtime or network_runtime.index(field) > network_runtime.index('#if UNITY_ANDROID'):
              raise SystemExit('Android runtime class layout is platform-dependent')

          android_manifest = Path('Assets/Plugins/Android/AndroidManifest.xml')
          tree = ET.parse(android_manifest)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          application = root.find('application')
          if application is None:
              raise SystemExit('Android application element is missing')

          launcher = None
          for activity in application.findall('activity'):
              if activity.get(android + 'name') != 'com.unity3d.player.UnityPlayerGameActivity':
                  continue
              actions = {
                  node.get(android + 'name')
                  for intent in activity.findall('intent-filter')
                  for node in intent.findall('action')
              }
              categories = {
                  node.get(android + 'name')
                  for intent in activity.findall('intent-filter')
                  for node in intent.findall('category')
              }
              if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                  launcher = activity
                  break

          if launcher is None:
              raise SystemExit('MAIN/LAUNCHER UnityPlayerGameActivity is missing')
          if launcher.get(android + 'exported') != 'true':
              raise SystemExit('Launcher activity must be exported on modern Android')

          android_text = android_manifest.read_text()
          for permission in (
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.CHANGE_WIFI_MULTICAST_STATE',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
          ):
              if permission not in android_text:
                  raise SystemExit(f'Missing Android permission: {permission}')

          print('Android release configuration and launcher are valid')

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.20f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.cs', 'Assets/Plugins/Android/**') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.20f1-

      - name: Run all EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        continue-on-error: true
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify EditMode NUnit results
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path('test-artifacts/editmode-results.xml')
          if not path.is_file():
              raise SystemExit('Unity did not produce EditMode test results')
          root = ET.parse(path).getroot()
          total = int(root.attrib.get('total', '0'))
          passed = int(root.attrib.get('passed', '0'))
          failed = int(root.attrib.get('failed', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          result = root.attrib.get('result', '')
          print(f'Unity EditMode: result={result}, total={total}, passed={passed}, failed={failed}, skipped={skipped}')
          if result != 'Passed' or total <= 0 or failed != 0 or passed != total:
              raise SystemExit('Unity EditMode tests did not pass completely')

      - name: Build Android release APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          buildMethod: Riftbound.Editor.BuildAutomation.BuildAndroid
          versioning: None
          allowDirtyBuild: true
          buildName: Riftbound
          buildPath: Builds/Android

      - name: Normalize and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/Builds/Android/Riftbound.apk"
          source="$(find "$GITHUB_WORKSPACE" -type f -iname '*.apk' -printf '%s\t%p\n' | sort -nr | head -n 1 | cut -f 2-)"
          if [ -z "$source" ] || [ ! -s "$source" ]; then
            echo "Unity reported success but no APK was found" >&2
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -print | sort
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          if [ "$(realpath "$source")" != "$(realpath -m "$target")" ]; then
            cp "$source" "$target"
          fi
          size="$(stat -c%s "$target")"
          if [ "$size" -lt 10000000 ]; then
            echo "APK is unexpectedly small: $size bytes" >&2
            exit 1
          fi
          unzip -tq "$target"
          aapt="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$target")"
          echo "$badging"
          grep -F "package: name='com.chatmcpconnector.riftbound'" <<<"$badging"
          grep -F "launchable-activity: name='com.unity3d.player.UnityPlayerGameActivity'" <<<"$badging"
          file "$target"
          sha256sum "$target"
          ls -lh "$target"

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-android-1.0.1
          path: |
            Builds/Android/Riftbound.apk
            test-artifacts
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
