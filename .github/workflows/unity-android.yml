name: Android prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate project structure and phase 5C authority
        run: |
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Assets/Game/Core/GameData.cs
          test -f Assets/Game/Core/RunSystems.cs
          test -f Assets/Game/Core/GameBootstrap.cs
          test -f Assets/Game/Core/BiomeSystems.cs
          test -f Assets/Game/Combat/PlayerController.cs
          test -f Assets/Game/Combat/EnemyController.cs
          test -f Assets/Game/Items/InventorySystem.cs
          test -f Assets/Game/Coop/CoopSystems.cs
          test -f Assets/Game/Coop/CoopLanController.cs
          test -f Assets/Game/Coop/CoopCombatSystems.cs
          test -f Assets/Game/Coop/CoopCombatReplicator.cs
          test -f Assets/Game/Coop/CoopCombatWorld.cs
          test -f Assets/Game/Coop/CoopAuthoritySystems.cs
          test -f Assets/Game/Coop/EnemyNetworkExtensions.cs
          test -f Assets/Game/UI/TouchHud.cs
          test -f Assets/Game/UI/InventoryView.cs
          test -f Assets/Game/UI/CoopView.cs
          test -f Assets/Game/Tests/EditMode/InventoryTests.cs
          test -f Assets/Game/Tests/EditMode/BiomeSystemTests.cs
          test -f Assets/Game/Tests/EditMode/CoopSystemTests.cs
          test -f Assets/Game/Tests/EditMode/CoopCombatTests.cs
          test -f Assets/Game/Tests/EditMode/CoopAuthorityTests.cs
          test -f Assets/Game/Editor/BuildAutomation.cs
          test -f docs/COOP.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("Packages/manifest.json").read_text())
          required_packages = {
              "com.unity.inputsystem",
              "com.unity.render-pipelines.universal",
              "com.unity.test-framework",
              "com.unity.ugui",
          }
          missing = required_packages - set(manifest["dependencies"])
          if missing:
              raise SystemExit(f"Missing packages: {sorted(missing)}")

          source_paths = list(Path("Assets/Game").rglob("*.cs"))
          sources = "\n".join(path.read_text() for path in source_paths)
          required_symbols = (
              "RunPlanner",
              "LootGenerator",
              "RunInventory",
              "InventoryView",
              "ItemRarity.Cursed",
              "MetaProgression",
              "BiomePlanner",
              "EncounterDirector",
              "CoopProtocol",
              "CoopLanController",
              "CoopCombatProtocol",
              "CoopCombatReplicator",
              "CoopCombatWorld",
              "CoopAuthorityProtocol",
              "CoopAuthorityValidation",
              "CoopTargeting",
              "CoopProjectileSnapshot",
              "CoopDefenseState",
              "CoopDamageEvent",
              "EnemyNetworkExtensions",
              "CreateSnapshot",
              "ApplyReplicaSnapshot",
              "SetReplicaMode",
              "SendAttackIntent",
              "TryDamageRemote",
              "TakeNetworkDamage",
              "IsNetworkInvulnerable",
              "CaptureEnemySnapshots",
              "ApplyEnemySnapshots",
              "ReleaseReplicaProjectiles",
              'Prefix = "RB5C"',
              'Prefix = "RB5H"',
              "CombatPort = 47820",
              "SynchronizeToHost",
              'SendCommand("ADVANCE")',
              'case "ADVANCE"',
              "forceInternetPermission = true",
              "GameBootstrap",
              "PlayerController",
              "EnemyController",
              "TouchHud",
          )
          for symbol in required_symbols:
              if symbol not in sources:
                  raise SystemExit(f"Missing symbol: {symbol}")

          forbidden = (
              "offer.kind",
              "offer.catalogIndex",
              "EquipWeapon(",
              "EquipArmor(",
              "SetGold(",
              "game.CaptureEnemySnapshots(",
              "game.SetEnemyReplication(",
              "game.ApplyEnemySnapshots(",
              "game.ApplyRemoteAttack(",
          )
          for token in forbidden:
              if token in sources:
                  raise SystemExit(f"Forbidden legacy or unresolved call remains: {token}")

          combat_protocol = Path("Assets/Game/Coop/CoopCombatSystems.cs").read_text()
          authority = Path("Assets/Game/Coop/CoopAuthoritySystems.cs").read_text()
          runtime = Path("Assets/Game/Coop/CoopCombatReplicator.cs").read_text()
          enemy = Path("Assets/Game/Combat/EnemyController.cs").read_text()
          player = Path("Assets/Game/Combat/PlayerController.cs").read_text()
          tests = Path("Assets/Game/Tests/EditMode/CoopAuthorityTests.cs").read_text()

          for token in ("ENEMIES", "ATTACK", "CultureInfo.InvariantCulture", "count > 64"):
              if token not in combat_protocol:
                  raise SystemExit(f"Combat protocol guard missing: {token}")
          for token in ("PROJECTILES", "DEFENSE", "DAMAGE", "count > 128", "CoopTargeting"):
              if token not in authority:
                  raise SystemExit(f"Authority protocol guard missing: {token}")
          for token in (
              "EncodeProjectiles",
              "TryDecodeDefense",
              "TryDecodeDamage",
              "TryDamageRemote",
              "TakeNetworkDamage",
              "Projectile.ReleaseReplicaProjectiles",
          ):
              if token not in runtime:
                  raise SystemExit(f"Runtime authority integration missing: {token}")
          for token in (
              "ResolveTarget",
              "CoopTargeting.SelectNearest",
              "CaptureEnemySnapshots",
              "ApplyEnemySnapshots",
              "TryHitRemotePlayer",
              "CoopDamageKind.Projectile",
          ):
              if token not in enemy:
                  raise SystemExit(f"Enemy or projectile authority missing: {token}")
          if "IsNetworkInvulnerable" not in player or "TakeNetworkDamage" not in player:
              raise SystemExit("Client defense or host-confirmed damage application missing")
          if 'GetCultureInfo("de-DE")' not in tests:
              raise SystemExit("Locale-independent authority protocol test missing")
          if "DuplicateProjectileIdsAreRejected" not in tests or "EqualDistanceAggroIsSplitByEnemyId" not in tests:
              raise SystemExit("Projectile identity or target split test missing")

          for path in source_paths:
              text = path.read_text()
              if text.count("{") != text.count("}"):
                  raise SystemExit(f"Unbalanced braces: {path}")
              if text.count("#if") != text.count("#endif"):
                  raise SystemExit(f"Unbalanced preprocessor blocks: {path}")

          version = Path("ProjectSettings/ProjectVersion.txt").read_text()
          build = Path("Assets/Game/Editor/BuildAutomation.cs").read_text()
          if "6000.3.20f1" not in version:
              raise SystemExit("Unexpected Unity version")
          if 'bundleVersion = "0.7.0"' not in build:
              raise SystemExit("Unexpected Android app version")
          if "bundleVersionCode = 7" not in build:
              raise SystemExit("Unexpected Android version code")

          print("Static phase 5C authority validation passed")
          PY

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.20f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.cs') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.20f1-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          buildMethod: Riftbound.Editor.BuildAutomation.BuildAndroid
          customParameters: -customBuildPath Builds/Android/Riftbound.apk

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-android-0.7.0
          path: |
            Builds/Android/Riftbound.apk
            test-artifacts
          if-no-files-found: warn
          retention-days: 14
