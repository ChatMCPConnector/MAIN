name: Apply repository hardening migration

on:
  push:
    branches:
      - fix/repository-hardening-20260727
    paths:
      - tools/apply_repository_hardening.py
      - .github/workflows/apply-repository-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_repository_hardening.py
      - .github/workflows/apply-repository-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply targeted repository fixes
        run: python tools/apply_repository_hardening.py

      - name: Validate patched repository
        run: |
          python -m compileall -q tools
          python tools/asset_pipeline.py validate
          python tools/validate_project.py
          git diff --check

      - name: Commit hardened repository
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix gameplay lifecycle, assets and CI verification"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
