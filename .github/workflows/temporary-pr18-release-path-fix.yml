name: Temporary PR18 Release Path Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/extract-unity-build-log.yml"
  issues:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  patch-release-workflow:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.number == 18) ||
      (github.event_name == 'issues' && github.event.issue.title == 'Apply Android source fixes PR 18')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-release-build
          fetch-depth: 0

      - name: Align release APK output and verification
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/unity-android.yml')
          text = path.read_text()
          old = '''      - name: Build Android release APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          buildMethod: Riftbound.Editor.BuildAutomation.BuildAndroid
          customParameters: -customBuildPath Builds/Android/Riftbound.apk

      - name: Upload APK and diagnostics
'''
          new = '''      - name: Build Android release APK
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          buildMethod: Riftbound.Editor.BuildAutomation.BuildAndroid
          versioning: None
          allowDirtyBuild: true
          buildName: Riftbound
          buildPath: Builds/Android

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/Riftbound.apk
          file Builds/Android/Riftbound.apk
          sha256sum Builds/Android/Riftbound.apk
          ls -lh Builds/Android/Riftbound.apk

      - name: Upload APK and diagnostics
'''
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected release builder block was not found')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Commit release workflow correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/unity-android.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Align release APK output with GameCI"
            git push origin HEAD:fix/android-release-build
          fi

      - name: Remove temporary workflow from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/temporary-pr18-release-path-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Remove temporary PR 18 release path fixer"
          git push origin HEAD:main
