name: Apply one-shot Godot 4.7 fixes

on:
  push:
    branches: [neon-rift-final-candidate]

permissions:
  contents: write

jobs:
  fix-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-rift-final-candidate
      - run: python tools/apply_godot47_fixes.py
      - name: Commit exact source fixes
        run: |
          if git diff --quiet; then
            echo "No fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/main.gd
          git commit -m "Fix Godot 4.7 parser and type errors"
          git push origin HEAD:neon-rift-final-candidate
