# checks.yml — die Code-Jobs. Laufen bei jedem Push auf main und jedem PR.
#
# Zweck (PLAN Stufe 2): bis 2026-10-01 hing **jeder** Check daran, dass ein
# Agent `AGENTS.md §6` befolgt. Wird er übersprungen, fällt es still aus.
# Dieser Workflow macht die Quellcode-Hälfte davon agentenunabhängig.
#
# Ehrliche Abgrenzung — was dieser Workflow **nicht** ersetzt:
#   * `verify-codespace.sh` im Codespace bleibt die Aussage über die LAUFENDE
#     Kette (Ports 8001/9878/7250/4096, Daemons, Secrets-Bundle, Drive).
#     Ein Runner hat davon nichts — dort wären ~20 Checks FAIL, ohne dass
#     etwas defekt ist.
#   * Deshalb fährt der `repo`-Job `verify-codespace.sh --code`: nur der
#     Quellcode-Teil. Job `repo` kann sauber sein, während die Kette im
#     Codespace steht — und umgekehrt. Beide Aussagen bleiben, nur getrennt.
#   * Provider-Calls (keys.sh doctor, glm2api-Smoke-Test) laufen hier NICHT:
#     sie kosten Kontingent, treffen Rate-Limits und ein flaky Live-Check wird
#     sehr schnell übersprungen (PLAN Stufe 5, dort als Tier B).
#
# Toolchain-Pins: alle Versionen kommen aus dem Repo, nicht aus dieser Datei —
# Go aus `go.mod`, Python aus `.python-version`, pnpm aus `packageManager` in
# package.json. Der Verify-Check „CI-Pins decken Repo-Pins“ wird rot, sobald
# hier eine Version steht, die das Repo nicht führt. Grund: der Job soll an
# genau der Toolchain des Codespaces hängen, nicht an einer zweiten Wahrheit.
#
# Merkposten: `timeout-minutes` steht auf JOB-Ebene, nicht unter `defaults.run`
# (dort sind nur `shell` und `working-directory` erlaubt). Ein erster Versuch
# mit `defaults.run.timeout-minutes` wurde von GitHub als „Invalid workflow
# file" abgewiesen, noch bevor ein Job lief.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Kein Schreibzugriff nötig (nur lesen) — Least Privilege auch bei public Repo.
permissions:
  contents: read

# Ein neuer Push macht den laufenden Lauf obsolet.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glm2api:
    name: glm2api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-proxies/glm2api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # .python-version (3.14) ist die Quelle; enable-cache nutzt uv.lock.
          enable-cache: true
          python-version: '3.14'
      - name: Lockfile konsistent (Drift-Wächter)
        run: uv lock --check
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: pytest
        run: uv run pytest -q

  antigravity:
    name: antigravity-proxy (go vet + test + gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-proxies/antigravity-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Aus go.mod lesen, nicht hier eintragen — sonst driftet der Job an
          # der Toolchain statt am Code (PLAN Stufe 2).
          # ACHTUNG: der Pfad ist relativ zum Repo-Root, NICHT zum
          # `working-directory` des Jobs — sonst: „go version file does not
          # exist" (hat der erste Lauf gezeigt).
          go-version-file: llm-proxies/antigravity-proxy/go.mod
          cache-dependency-path: llm-proxies/antigravity-proxy/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt (read-only)
        run: |
          un="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$un" ]; then echo "gofmt noetig: $un"; exit 1; fi
      - name: go test
        run: go test ./...

  zerokey:
    name: zerokey (pnpm lint + check + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-proxies/zerokey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines.node sagt ">=18"; der Codespace nutzt eine aktuelle LTS.
          node-version: '22'
      # corepack NACH setup-node, und bewusst OHNE `cache: pnpm` in der
      # Node-Action: die Cache-Ermittlung sucht pnpm auf dem PATH, bevor es
      # aktiviert ist, und bricht mit „Unable to locate executable file: pnpm"
      # ab (hat der erste Lauf gezeigt). Ohne Cache ist der Job nur ein paar
      # Sekunden langsamer, aber robust — ein Cache-Fehler wäre ein rotes
      # Roteichen, das nichts über den Code sagt.
      - name: corepack + pnpm (Pin aus packageManager)
        run: |
          corepack enable
          echo "pnpm $(pnpm --version) (Pin aus packageManager)"
      # --frozen-lockfile: schlägt fehl, wenn package.json und Lockfile
      # auseinanderlaufen. Danach der Diff-Test: schreibt jemand am Lockfile
      # vorbei, sieht es dieser Job.
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lockfile unveraendert
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: lint
        run: pnpm lint
      - name: check
        run: pnpm check
      - name: test
        run: pnpm test

  infra-python:
    name: infra-Python (ruff + mypy + pytest + Coverage-Floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Hier gibt es eine echte Root-Umgebung (pyproject.toml + uv.lock),
          # also ist der uv-Cache nuetzbar — anders als im repo-Job, wo er am
          # fehlenden uv.lock scheiterte.
          enable-cache: true
          python-version: '3.14'
      - name: Lockfile konsistent
        run: uv lock --check
      - name: ruff (infra/, Vendor-Baeume ausgeschlossen)
        run: uv run ruff check .
      - name: mypy (infra/scripts)
        run: uv run mypy
      # Der Floor gilt fuer check-proxy-budget.py — die Datei, die den echten
      # Bug vom 2026-09-30 gefunden hat. `uv run pytest` allein laeuft darunter
      # als eigene Zeile, damit ein roter Test und eine zu niedrige Coverage
      # unterscheidbar bleiben.
      - name: pytest
        run: uv run pytest -q
      - name: Coverage-Floor (>=90 % fuer check-proxy-budget.py)
        run: uv run pytest -q --cov --cov-config=infra/coverage-floor.rc --cov-report=term-missing

  infra:
    name: infra (bash -n + node --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: bash -n ueber alle Shell-Skripte
        run: |
          files="$(git ls-files '*.sh')"
          echo "$files" | xargs -r -n1 bash -n
          echo "bash -n ok ($(echo "$files" | wc -l) Skripte)"
      - name: node --check ueber infra-JS
        run: |
          files="$(git ls-files | grep '^infra/' | grep '\.js$' || true)"
          if [ -z "$files" ]; then echo "keine infra-JS-Dateien"; exit 0; fi
          echo "$files" | xargs -r -n1 node --check
          echo "infra-JS ok"

  repo:
    name: repo (verify-codespace.sh --code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Drei Checks sehen sich repo-lokale git-Config bzw. $HOME an. Die
      # emulieren hier, was setup.sh im Codespace tut — sonst wären sie rot,
      # ohne dass etwas defekt ist. Die inhaltlichen Checks bleiben unberührt.
      - name: core.hooksPath setzen (wie setup.sh)
        run: git config core.hooksPath .githooks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Kein setup-uv: die --code-Checks brauchen nur `python3` (Budget-Python,
      # System-Interpreter auf dem Runner), kein uv-Projekt. Mit `enable-cache`
      # wäre der Post-Step gescheitert („cache path does not exist"), weil es
      # im Repo-Root keine uv.lock gibt.
      - uses: actions/setup-go@v5
        with:
          go-version-file: llm-proxies/antigravity-proxy/go.mod
      - name: verify-codespace.sh --code
        run: ./infra/scripts/verify-codespace.sh --code