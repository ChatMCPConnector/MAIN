name: GitHub Actions Smoke Check

on:
  push:
    paths:
      - ".github/action-smoke-trigger/**"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write smoke result
        run: |
          set -euo pipefail
          mkdir -p Builds
          cat > Builds/actions-smoke.json <<EOF
          {
            "status": "success",
            "run_id": ${{ github.run_id }},
            "head_sha": "${{ github.sha }}",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit smoke result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Builds/actions-smoke.json
          git commit -m "Record GitHub Actions smoke check ${{ github.run_id }}"
          git push origin HEAD:main
