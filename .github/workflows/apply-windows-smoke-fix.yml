name: Apply one-shot Windows smoke positioning fix

on:
  push:
    branches: [neon-rift-final-candidate]

permissions:
  contents: write

jobs:
  fix-smoke-position:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-rift-final-candidate
      - run: python tools/apply_windows_smoke_position_fix.py
      - name: Commit exact smoke-test fix
        run: |
          if git diff --quiet; then
            echo "No smoke-test fix required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/main.gd
          git commit -m "Fix Windows smoke-test combat positioning"
          git push origin HEAD:neon-rift-final-candidate
